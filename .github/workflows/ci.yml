name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: pip install pyyaml
      - name: Lint skills
        run: python3 tools/lint_skills.py
      - name: Layout check
        run: python3 tools/check_layout.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: vibe-check (changes in this PR or push)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python3 skills/ship/scripts/vibe_check.py --all
          else
            python3 skills/ship/scripts/vibe_check.py --range "$BASE...HEAD"
          fi

  evals:
    # The evals are reporting tools, not gates: this job proves the harness still
    # runs and prints its numbers, so the figures quoted in README.md and
    # evals/README.md cannot silently rot. The numeric guard for routing lives in
    # tests/test_routing.py, which the check job runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eval dependencies
        run: pip install pytest hypothesis
      - name: Routing
        run: python3 evals/routing.py
      - name: Tamper guard
        run: python3 evals/tamper_guard.py
      - name: ratchet vs naive gate
        run: python3 evals/ratchet_vs_naive.py
      - name: Delegation
        run: python3 evals/delegation.py
      - name: Mutation - weak suite vs strong suite
        run: sh evals/mutation/run.sh
